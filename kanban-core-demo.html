<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanboard · 核心 + 基础功能 Demo</title>
<style>
  :root {
    --bg: #eef1f6;
    --bg-grad: linear-gradient(180deg, #eef2f8 0%, #e7ebf2 100%);
    --surface: #ffffff;
    --list-bg: #f4f5f7;
    --border: #e3e6ec;
    --border-strong: #d3d8e0;
    --text: #1f2430;
    --text-2: #5b6472;
    --text-3: #9aa3b2;
    --primary: #3b6cf6;
    --primary-dark: #2f59d4;
    --danger: #e5484d;
    --success: #27ae60;
    --warning: #b76e00;
    --ink: 20, 28, 46;
    --radius: 12px;
    --radius-sm: 9px;
    --shadow-sm: 0 1px 2px rgba(var(--ink), .08);
    --shadow-md: 0 4px 14px rgba(var(--ink), .10);
    --shadow-lg: 0 10px 30px rgba(var(--ink), .16);
    --list-w: 290px;
  }
  /* ---------- 主题 ---------- */
  body.theme-light { --bg: #eef1f6; --bg-grad: linear-gradient(180deg, #eef2f8 0%, #e7ebf2 100%); --surface: #ffffff; --list-bg: #f4f5f7; --border: #e3e6ec; --border-strong: #d3d8e0; --text: #1f2430; --text-2: #5b6472; --text-3: #9aa3b2; --primary: #3b6cf6; --primary-dark: #2f59d4; --danger: #e5484d; --success: #27ae60; --warning: #b76e00; --ink: 20, 28, 46; --shadow-sm: 0 1px 2px rgba(var(--ink), .08); --shadow-md: 0 4px 14px rgba(var(--ink), .10); --shadow-lg: 0 10px 30px rgba(var(--ink), .16); }
  body.theme-dark { --bg: #12151d; --bg-grad: linear-gradient(180deg, #12151d 0%, #0e1117 100%); --surface: #1a1f2b; --list-bg: #232936; --border: #2b3342; --border-strong: #3d475c; --text: #e8ecf5; --text-2: #a7b0c4; --text-3: #6a758d; --primary: #5b8aff; --primary-dark: #3d6cf5; --danger: #ff5a5f; --success: #3ed68e; --warning: #ffc46b; --ink: 232, 236, 245; --shadow-sm: 0 1px 2px rgba(0, 0, 0, .25); --shadow-md: 0 4px 14px rgba(0, 0, 0, .30); --shadow-lg: 0 10px 40px rgba(0, 0, 0, .45); }
  body.theme-dark .modal-back { background: rgba(0, 0, 0, .55); }
  body.theme-warm { --bg: #f5efe7; --bg-grad: linear-gradient(180deg, #f5efe7 0%, #ede6dc 100%); --surface: #fffdf9; --list-bg: #f4f0ea; --border: #e8e0d4; --border-strong: #d6cdc0; --text: #2c2620; --text-2: #6b6155; --text-3: #a89b8b; --primary: #b36d32; --primary-dark: #8f541f; --danger: #c94a4a; --success: #5c8c4e; --warning: #a36d00; --ink: 44, 38, 32; --shadow-sm: 0 1px 2px rgba(44, 38, 32, .07); --shadow-md: 0 4px 14px rgba(44, 38, 32, .09); --shadow-lg: 0 10px 30px rgba(44, 38, 32, .14); }
  body.theme-forest { --bg: #e7f0ec; --bg-grad: linear-gradient(180deg, #e7f0ec 0%, #dce8e2 100%); --surface: #f7fbfa; --list-bg: #eef5f2; --border: #d5e3dd; --border-strong: #bdcfca; --text: #1b2c26; --text-2: #476156; --text-3: #7c998d; --primary: #2a8f5c; --primary-dark: #1f7a4c; --danger: #c94a4a; --success: #3e9e6e; --warning: #a36d00; --ink: 27, 44, 38; --shadow-sm: 0 1px 2px rgba(27, 44, 38, .07); --shadow-md: 0 4px 14px rgba(27, 44, 38, .09); --shadow-lg: 0 10px 30px rgba(27, 44, 38, .14); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue",
      "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 14px; color: var(--text); background: var(--bg-grad);
    -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  button { font-family: inherit; cursor: pointer; }
  input, textarea, select { font-family: inherit; font-size: 14px; }
  [hidden] { display: none !important; }

  .app { height: 100vh; }
  .layout { display: flex; height: 100%; min-height: 0; }

  /* ---------- 侧边栏（项目切换） ---------- */
  .sidebar { width: 250px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  .sidebar-brand { display: flex; align-items: center; gap: 10px; padding: 16px 18px; font-weight: 700; font-size: 17px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .sidebar-brand .dot { width: 12px; height: 12px; border-radius: 4px; background: var(--primary); }
  .sidebar-label { padding: 14px 18px 6px; font-size: 11px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--text-3); }
  .proj-list { flex: 1; overflow-y: auto; padding: 2px 10px; }
  .proj-list::-webkit-scrollbar { width: 8px; }
  .proj-list::-webkit-scrollbar-thumb { background: rgba(var(--ink),.16); border-radius: 4px; }
  .proj { position: relative; width: 100%; display: flex; align-items: center; gap: 10px; border: none; background: transparent; border-radius: 9px; padding: 8px 10px; text-align: left; cursor: pointer; color: var(--text); margin-bottom: 2px; }
  .proj:hover { background: var(--list-bg); }
  .proj.active { background: color-mix(in srgb, var(--primary) 12%, transparent); }
  .proj.active::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 3px; background: var(--primary); }
  .proj-ico { width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 15px; color: #fff; flex-shrink: 0; }
  .proj-info { flex: 1; min-width: 0; }
  .proj-name { display: block; font-size: 13.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .proj-meta { display: block; font-size: 11.5px; color: var(--text-3); margin-top: 1px; }
  .proj-menu { width: 24px; height: 24px; border: none; border-radius: 6px; background: transparent; color: var(--text-3); font-size: 14px; letter-spacing: 1px; opacity: 0; flex-shrink: 0; }
  .proj:hover .proj-menu { opacity: 1; }
  .proj-menu:hover { background: rgba(var(--ink),.08); color: var(--text); }
  .proj-menu-dropdown { position: absolute; top: calc(100% + 2px); right: 6px; min-width: 150px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow-lg); z-index: 30; padding: 6px; }
  .proj-rename-input { width: 100%; font-family: inherit; font-size: 13.5px; font-weight: 600; border: 1px solid var(--primary); border-radius: 6px; padding: 2px 6px; outline: none; background: var(--surface); color: var(--text); }
  .sidebar-new { padding: 10px 12px; border-top: 1px solid var(--border); flex-shrink: 0; }
  .sidebar-new button { width: 100%; text-align: left; border: none; background: transparent; color: var(--text-2); padding: 9px 10px; border-radius: 9px; font-size: 13.5px; display: flex; align-items: center; gap: 8px; }
  .sidebar-new button:hover { background: var(--list-bg); color: var(--text); }
  .sidebar-footer { padding: 10px 14px; border-top: 1px solid var(--border); flex-shrink: 0; }
  .sidebar-footer .theme-select { width: 100%; }
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  /* ---------- 顶栏 ---------- */
  .topbar {
    display: flex; align-items: center; gap: 14px;
    padding: 13px 22px; background: var(--surface);
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 16px; }
  .brand .dot { width: 11px; height: 11px; border-radius: 3px; background: var(--primary); }
  .board-title {
    font-size: 19px; font-weight: 700; border: 2px solid transparent; border-radius: 7px;
    padding: 3px 8px; margin-left: 4px; cursor: text; max-width: 40vw;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .board-title:hover { background: var(--list-bg); }
  .board-title:focus { outline: none; border-color: var(--primary); background: var(--surface); }
  .scope-tag {
    font-size: 11px; font-weight: 600; color: var(--primary);
    background: color-mix(in srgb, var(--primary) 10%, transparent); border: 1px solid color-mix(in srgb, var(--primary) 25%, transparent);
    padding: 3px 10px; border-radius: 999px; letter-spacing: .3px;
  }
  .spacer { flex: 1; }
  .hint { font-size: 12.5px; color: var(--text-3); }
  .theme-select { border: 1px solid var(--border-strong); background: var(--surface); color: var(--text-2); border-radius: 8px; padding: 5px 9px; font-size: 13px; cursor: pointer; outline: none; }
  .theme-select:focus { border-color: var(--primary); }

  /* ---------- 筛选工具条 ---------- */
  .toolbar {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 9px 22px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .search {
    display: flex; align-items: center; gap: 7px; background: var(--surface);
    border: 1px solid var(--border-strong); border-radius: 8px; padding: 6px 10px; min-width: 220px;
  }
  .search input { border: none; outline: none; width: 100%; background: transparent; }
  .filter-group { display: flex; align-items: center; gap: 6px; }
  .filter-group .lbl { font-size: 12px; color: var(--text-3); margin-right: 2px; }
  .fchip {
    border: 1px solid var(--border-strong); background: var(--surface); border-radius: 999px;
    width: 26px; height: 26px; display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; color: var(--text-2); padding: 0;
  }
  .fchip.dot { border-radius: 50%; }
  .fchip.active { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(59,108,246,.25); }
  .fchip.dot.active { outline: 2px solid var(--primary); outline-offset: 1px; }
  .due-select { border: 1px solid var(--border-strong); border-radius: 8px; padding: 6px 9px; background: var(--surface); color: var(--text-2); }
  .clear-filter { border: none; background: transparent; color: var(--primary); font-size: 12.5px; font-weight: 600; }
  .clear-filter:hover { text-decoration: underline; }

  /* ---------- 看板区 ---------- */
  .board { flex: 1; display: flex; align-items: flex-start; gap: 16px; padding: 22px; overflow-x: auto; overflow-y: hidden; }
  .board::-webkit-scrollbar { height: 11px; }
  .board::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 6px; }
  .board::-webkit-scrollbar-track { background: transparent; }

  .list {
    width: var(--list-w); flex-shrink: 0; background: var(--list-bg);
    border: 1px solid var(--border); border-radius: var(--radius);
    display: flex; flex-direction: column; max-height: 100%; box-shadow: var(--shadow-sm);
  }
  .list.dragging { opacity: .4; }
  .list.hidden { display: none; }
  .list-header { display: flex; align-items: center; gap: 6px; padding: 10px 10px 9px; position: relative; user-select: none; }
  .drag-handle { cursor: grab; color: var(--text-3); font-size: 13px; letter-spacing: -1px; padding: 2px 4px; border-radius: 5px; line-height: 1; }
  .drag-handle:hover { background: rgba(var(--ink),.06); color: var(--text-2); }
  .list-title {
    flex: 1; font-weight: 700; font-size: 14.5px; border: 2px solid transparent; border-radius: 6px;
    padding: 2px 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: text;
  }
  .list-title:hover { background: rgba(var(--ink),.04); }
  .list-title:focus { outline: none; border-color: var(--primary); background: var(--surface); }
  .list-count { font-size: 12px; color: var(--text-3); background: rgba(var(--ink),.06); padding: 1px 8px; border-radius: 999px; flex-shrink: 0; }
  .list-menu { width: 26px; height: 26px; border: none; border-radius: 7px; background: transparent; color: var(--text-3); font-size: 12px; letter-spacing: 1px; line-height: 1; display: flex; align-items: center; justify-content: center; margin-left: auto; }
  .list-menu:hover { background: rgba(var(--ink),.06); color: var(--text); }
  .list-menu-dropdown { position: absolute; top: calc(100% + 6px); right: 10px; min-width: 160px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow-lg); z-index: 20; padding: 6px; display: flex; flex-direction: column; }
  .list-menu-item { border: none; background: transparent; text-align: left; padding: 8px 12px; border-radius: 7px; color: var(--text); font-size: 13.5px; cursor: pointer; }
  .list-menu-item:hover { background: var(--list-bg); }
  .list-menu-item.danger { color: var(--danger); }
  .list-menu-item.danger:hover { background: color-mix(in srgb, var(--danger) 10%, transparent); }
  .list-menu-divider { height: 1px; background: var(--border); margin: 5px 6px; }
  .cards { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 2px 10px; min-height: 12px; }
  .cards::-webkit-scrollbar { width: 8px; }
  .cards::-webkit-scrollbar-thumb { background: rgba(var(--ink),.16); border-radius: 4px; }

  /* ---------- 卡片 ---------- */
  .card {
    position: relative; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 10px 12px 11px; margin-bottom: 9px;
    box-shadow: var(--shadow-sm); cursor: pointer; user-select: none;
    transition: box-shadow .14s, transform .14s, border-color .14s;
  }
  .card:hover { box-shadow: var(--shadow-md); border-color: var(--border-strong); }
  .card.dragging { opacity: .35; }
  .card.hidden { display: none; }
  .card-labels { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 7px; }
  .card-labels .lab { width: 38px; height: 7px; border-radius: 4px; }
  .card-title { font-size: 14px; line-height: 1.5; color: var(--text); word-break: break-word; }
  .card-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 9px; }
  .badge-due {
    display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600;
    padding: 2px 8px; border-radius: 6px; background: rgba(var(--ink),.06); color: var(--text-2);
  }
  .badge-due.overdue { background: color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger); }
  .badge-due.soon { background: color-mix(in srgb, var(--warning) 18%, transparent); color: var(--warning); }
  .ind { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; color: var(--text-3); }
  .ind svg { width: 13px; height: 13px; }
  .avatars { display: flex; margin-left: auto; }
  .avatar {
    width: 24px; height: 24px; border-radius: 50%; color: #fff; font-size: 11px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; border: 2px solid var(--surface);
    margin-left: -6px;
  }
  .card-del { position: absolute; top: 7px; right: 7px; width: 20px; height: 20px; border: none; border-radius: 5px; background: transparent; color: var(--text-3); font-size: 15px; line-height: 1; opacity: 0; transition: opacity .12s; }
  .card:hover .card-del { opacity: 1; }
  .card-del:hover { background: color-mix(in srgb, var(--danger) 10%, transparent); color: var(--danger); }

  .card-placeholder { height: 44px; margin-bottom: 9px; border-radius: var(--radius-sm); border: 2px dashed var(--primary); background: rgba(59,108,246,.07); }
  .list-placeholder { width: var(--list-w); flex-shrink: 0; align-self: stretch; border-radius: var(--radius); border: 2px dashed var(--primary); background: rgba(59,108,246,.07); min-height: 80px; }

  /* ---------- 添加卡片 / 列表 ---------- */
  .composer { padding: 2px 10px 11px; flex-shrink: 0; }
  .composer-open { width: 100%; text-align: left; border: none; background: transparent; padding: 9px 11px; border-radius: var(--radius-sm); color: var(--text-2); font-size: 13.5px; display: flex; align-items: center; gap: 7px; }
  .composer-open:hover { background: rgba(var(--ink),.05); color: var(--text); }
  .composer-open::before { content: "＋"; font-size: 15px; }
  .composer-form { display: flex; flex-direction: column; gap: 8px; }
  .composer-form textarea { border: 2px solid var(--primary); border-radius: 8px; padding: 9px 11px; resize: none; outline: none; width: 100%; box-shadow: var(--shadow-sm); line-height: 1.5; background: var(--surface); }
  .composer-actions { display: flex; align-items: center; gap: 8px; }
  .btn-primary { border: none; background: var(--primary); color: #fff; border-radius: 7px; padding: 8px 15px; font-weight: 600; font-size: 13.5px; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-plain { border: none; background: transparent; color: var(--text-3); font-size: 19px; line-height: 1; padding: 2px 7px; border-radius: 6px; }
  .btn-plain:hover { background: var(--border); color: var(--text); }
  .add-list { width: var(--list-w); flex-shrink: 0; align-self: flex-start; }
  .add-list-open { width: 100%; text-align: left; border: none; background: rgba(var(--ink),.07); color: var(--text-2); padding: 12px 14px; border-radius: var(--radius); font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .add-list-open:hover { background: rgba(var(--ink),.13); color: var(--text); }
  .add-list-open::before { content: "＋"; font-size: 16px; }
  .add-list-form { background: var(--list-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow-sm); }
  .add-list-form input { border: 2px solid var(--primary); border-radius: 8px; padding: 9px 11px; outline: none; width: 100%; background: var(--surface); }

  /* ---------- 卡片详情弹层 ---------- */
  .modal-back { position: fixed; inset: 0; background: rgba(var(--ink),.45); display: flex; align-items: flex-start; justify-content: center; padding: 48px 16px; z-index: 50; overflow-y: auto; }
  .modal { width: 100%; max-width: 620px; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow-lg); overflow: hidden; }
  .modal-head { display: flex; align-items: flex-start; gap: 10px; padding: 18px 20px 10px; }
  .modal-title { flex: 1; font-size: 18px; font-weight: 700; border: 2px solid transparent; border-radius: 7px; padding: 3px 8px; outline: none; line-height: 1.45; }
  .modal-title:focus { border-color: var(--primary); background: var(--list-bg); }
  .modal-close { border: none; background: transparent; font-size: 22px; color: var(--text-3); width: 32px; height: 32px; border-radius: 8px; }
  .modal-close:hover { background: var(--list-bg); color: var(--text); }
  .modal-sub { padding: 0 20px 12px; color: var(--text-3); font-size: 12.5px; }
  .modal-body { padding: 6px 20px 20px; display: flex; flex-direction: column; gap: 18px; }
  .sec { display: flex; gap: 12px; }
  .sec-ico { width: 26px; flex-shrink: 0; color: var(--text-3); display: flex; justify-content: center; padding-top: 2px; }
  .sec-ico svg { width: 17px; height: 17px; }
  .sec-main { flex: 1; min-width: 0; }
  .sec-title { font-size: 12.5px; font-weight: 700; color: var(--text-2); text-transform: uppercase; letter-spacing: .4px; margin-bottom: 9px; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .pick { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border-strong); background: var(--surface); border-radius: 999px; padding: 4px 11px 4px 5px; font-size: 13px; color: var(--text-2); }
  .pick .sw { width: 16px; height: 16px; border-radius: 50%; }
  .pick .sw.bar { border-radius: 4px; width: 22px; height: 12px; }
  .pick.on { border-color: var(--primary); background: color-mix(in srgb, var(--primary) 10%, transparent); color: var(--primary-dark); font-weight: 600; }
  .due-input { border: 1px solid var(--border-strong); border-radius: 8px; padding: 7px 10px; background: var(--surface); }
  .cl-progress { height: 7px; background: var(--list-bg); border-radius: 999px; overflow: hidden; margin: 4px 0 10px; }
  .cl-progress > i { display: block; height: 100%; background: var(--success); }
  .cl-item { display: flex; align-items: center; gap: 9px; padding: 5px 0; }
  .cl-item input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--primary); }
  .cl-item.done span { text-decoration: line-through; color: var(--text-3); }
  .cl-item span { flex: 1; font-size: 13.5px; }
  .cl-add { display: flex; gap: 8px; margin-top: 6px; }
  .cl-add input { flex: 1; border: 1px solid var(--border-strong); border-radius: 8px; padding: 7px 10px; outline: none; background: var(--surface); }
  .cl-add input:focus { border-color: var(--primary); }
  .cmt { display: flex; gap: 9px; padding: 7px 0; }
  .cmt .body { flex: 1; }
  .cmt .who { font-size: 12.5px; font-weight: 700; color: var(--text); }
  .cmt .ts { font-size: 11.5px; color: var(--text-3); margin-left: 7px; }
  .cmt .txt { font-size: 13.5px; color: var(--text); line-height: 1.5; margin-top: 2px; white-space: pre-wrap; }
  .cmt-add { display: flex; gap: 8px; margin-top: 4px; }
  .cmt-add input { flex: 1; border: 1px solid var(--border-strong); border-radius: 8px; padding: 8px 11px; outline: none; background: var(--surface); }
  .cmt-add input:focus { border-color: var(--primary); }
  .att { display: flex; align-items: center; gap: 9px; padding: 7px 0; border-bottom: 1px solid var(--border); }
  .att img { width: 38px; height: 38px; border-radius: 7px; object-fit: cover; }
  .att .fico { width: 38px; height: 38px; border-radius: 7px; background: var(--list-bg); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: var(--text-2); }
  .att .meta { flex: 1; min-width: 0; }
  .att .nm { font-size: 13px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .att .sz { font-size: 11.5px; color: var(--text-3); }
  .att a.dl { font-size: 12px; color: var(--primary); text-decoration: none; }
  .att a.dl:hover { text-decoration: underline; }
  .att .rm { border: none; background: transparent; color: var(--text-3); font-size: 15px; }
  .att .rm:hover { color: var(--danger); }
  .file-btn { display: inline-block; border: 1px dashed var(--border-strong); border-radius: 8px; padding: 8px 13px; color: var(--text-2); font-size: 13px; cursor: pointer; }
  .file-btn:hover { border-color: var(--primary); color: var(--primary); }
  .empty-note { color: var(--text-3); font-size: 13px; }

  /* ---------- 删除二次确认弹窗 ---------- */
  .confirm-back { position: fixed; inset: 0; background: rgba(var(--ink), .45); display: flex; align-items: center; justify-content: center; z-index: 60; padding: 16px; }
  .confirm-box { width: 100%; max-width: 380px; background: var(--surface); border-radius: 12px; box-shadow: var(--shadow-lg); overflow: hidden; }
  .confirm-head { padding: 18px 20px 0; font-size: 16px; font-weight: 700; color: var(--text); }
  .confirm-body { padding: 8px 20px 18px; font-size: 14px; color: var(--text-2); line-height: 1.65; }
  .confirm-actions { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--border); }
  .confirm-actions .btn-cancel { border: 1px solid var(--border-strong); background: var(--surface); color: var(--text-2); border-radius: 7px; padding: 8px 16px; font-weight: 600; font-size: 13.5px; cursor: pointer; }
  .confirm-actions .btn-cancel:hover { background: var(--list-bg); }
  .confirm-actions .btn-danger { border: none; background: var(--danger); color: #fff; border-radius: 7px; padding: 8px 16px; font-weight: 600; font-size: 13.5px; cursor: pointer; }
  .confirm-actions .btn-danger:hover { filter: brightness(.94); }
  body.theme-dark .confirm-back { background: rgba(0, 0, 0, .55); }

  /* ---------- 详情页信息层级 ---------- */
  /* 辅助信息条（次要层级）：状态 / 负责人 / 时间 */
  .meta-bar { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; padding: 2px 2px 14px; border-bottom: 1px solid var(--border); }
  .meta-item { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--text-2); }
  .meta-item .lbl { color: var(--text-3); font-size: 12px; }
  .meta-status { font-weight: 600; color: var(--text); background: var(--list-bg); padding: 2px 11px; border-radius: 999px; font-size: 12px; }
  .meta-empty { color: var(--text-3); font-style: italic; font-size: 12.5px; }
  .avatar.sm { width: 22px; height: 22px; font-size: 10px; }
  .avatar.sm:first-child { margin-left: 0; }
  /* 需求描述：扁平富文本编辑区（编辑感文档界面，无嵌套盒子） */
  .desc-block { margin: 4px 0 6px; }
  .desc-label { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; letter-spacing: .3px; color: var(--text); margin-bottom: 10px; }
  .desc-label::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .rt-toolbar { display: flex; align-items: center; gap: 1px; flex-wrap: wrap; margin-bottom: 8px; }
  .rt-toolbar button { border: none; background: transparent; min-width: 30px; height: 30px; padding: 0 7px; border-radius: 7px; color: var(--text-2); font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: background .12s, color .12s; }
  .rt-toolbar button:hover { background: var(--list-bg); color: var(--text); }
  .rt-toolbar button.active { background: color-mix(in srgb, var(--primary) 10%, transparent); color: var(--primary-dark); }
  .rt-toolbar .sep { width: 1px; height: 18px; background: var(--border); margin: 0 6px; }
  .rt-toolbar .b { font-weight: 800; } .rt-toolbar .i { font-style: italic; } .rt-toolbar .u { text-decoration: underline; } .rt-toolbar .s { text-decoration: line-through; }
  .rt-editor { border: 1px solid var(--border-strong); border-radius: 10px; padding: 16px 18px; font-size: 15px; line-height: 1.85; color: var(--text); background: var(--surface); outline: none; min-height: 152px; transition: border-color .15s, box-shadow .15s; }
  .rt-editor:focus { border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 18%, transparent); }
  .rt-editor:empty:before { content: attr(data-placeholder); color: var(--text-3); pointer-events: none; }
  .rt-editor h1 { font-size: 21px; font-weight: 700; margin: .35em 0 .3em; line-height: 1.35; }
  .rt-editor h2 { font-size: 17px; font-weight: 700; margin: .35em 0 .3em; line-height: 1.4; }
  .rt-editor p { margin: 0 0 .6em; }
  .rt-editor ul, .rt-editor ol { padding-left: 22px; margin: 0 0 .6em; }
  .rt-editor li { margin: .2em 0; }
  .rt-editor blockquote { border-left: 3px solid var(--primary); margin: .6em 0; padding: .2em 14px; color: var(--text-2); background: rgba(59,108,246,.04); border-radius: 0 6px 6px 0; }
  .rt-editor code { background: var(--list-bg); padding: 1px 6px; border-radius: 5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  .rt-editor a { color: var(--primary); text-decoration: underline; }
  /* 次要属性分组：视觉权重低于需求描述 */
  .props { display: flex; flex-direction: column; gap: 14px; }
  .props .sec-ico, .props .sec-title { opacity: .8; }

  /* ---------- 通用 ---------- */
  .hidden { display: none !important; }

  /* ---------- 视图切换 ---------- */
  .view-switch { display: inline-flex; background: var(--list-bg); border: 1px solid var(--border); border-radius: 9px; padding: 3px; gap: 2px; }
  .view-switch button { border: none; background: transparent; color: var(--text-2); font-size: 13px; font-weight: 600; padding: 5px 12px; border-radius: 7px; cursor: pointer; }
  .view-switch button:hover { color: var(--text); }
  .view-switch button.active { background: var(--surface); color: var(--primary); box-shadow: var(--shadow-sm); }

  /* ---------- 表格视图 ---------- */
  .table-wrap { flex: 1; overflow: auto; padding: 18px 22px; width: 100%; min-height: 0; }
  .vt { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .vt thead th { text-align: left; padding: 10px 12px; color: var(--text-3); font-weight: 600; border-bottom: 2px solid var(--border); white-space: nowrap; }
  .vt tbody tr { border-bottom: 1px solid var(--border); cursor: pointer; }
  .vt tbody tr:hover { background: var(--list-bg); }
  .vt td { padding: 10px 12px; vertical-align: middle; color: var(--text); }
  .vt .t-title { font-weight: 600; max-width: 360px; }
  .vt .t-list { color: var(--text-2); white-space: nowrap; }
  .vt .t-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .vt .t-tag { font-size: 11px; padding: 1px 8px; border-radius: 999px; color: #fff; white-space: nowrap; }
  .vt .t-members { display: flex; }
  .vt .t-ind { color: var(--text-3); font-size: 12px; margin-right: 8px; white-space: nowrap; }

  /* ---------- 日历视图 ---------- */
  .cal-wrap { flex: 1; overflow: auto; padding: 18px 22px; width: 100%; min-height: 0; }
  .cal-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .cal-head h2 { font-size: 17px; font-weight: 700; }
  .cal-nav { border: 1px solid var(--border-strong); background: var(--surface); border-radius: 7px; min-width: 30px; height: 30px; padding: 0 10px; cursor: pointer; color: var(--text-2); font-size: 15px; }
  .cal-nav:hover { border-color: var(--primary); color: var(--primary); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .cal-dow { font-size: 12px; color: var(--text-3); font-weight: 600; text-align: center; padding-bottom: 4px; }
  .cal-cell { min-height: 104px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 7px; display: flex; flex-direction: column; gap: 5px; }
  .cal-cell.out { opacity: .4; }
  .cal-cell.today { border-color: var(--primary); box-shadow: 0 0 0 2px color-mix(in srgb, var(--primary) 18%, transparent); }
  .cal-date { font-size: 12px; color: var(--text-2); font-weight: 600; align-self: flex-start; }
  .cal-card { background: var(--list-bg); border: 1px solid var(--border); border-radius: 7px; padding: 5px 7px; font-size: 12px; cursor: pointer; line-height: 1.4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cal-card:hover { border-color: var(--primary); }
  .cal-empty { color: var(--text-2); font-size: 12.5px; padding: 12px 2px; line-height: 1.9; }

  /* ---------- @提及 ---------- */
  .mention { background: color-mix(in srgb, var(--primary) 16%, transparent); color: var(--primary-dark); border-radius: 4px; padding: 0 3px; font-weight: 600; }
  .mention-menu { position: absolute; z-index: 40; background: var(--surface); border: 1px solid var(--border); border-radius: 9px; box-shadow: var(--shadow-lg); padding: 5px; display: flex; flex-direction: column; min-width: 150px; }
  .mention-menu button { border: none; background: transparent; text-align: left; padding: 7px 10px; border-radius: 7px; font-size: 13px; color: var(--text); cursor: pointer; display: flex; align-items: center; gap: 8px; }
  .mention-menu button:hover, .mention-menu button.active { background: var(--list-bg); }
  .mention-menu .sw { width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0; }

  /* ---------- 命令面板 ⌘K ---------- */
  .palette-back { position: fixed; inset: 0; background: rgba(var(--ink), .4); display: flex; align-items: flex-start; justify-content: center; padding: 12vh 16px 16px; z-index: 70; }
  body.theme-dark .palette-back { background: rgba(0, 0, 0, .5); }
  .palette { width: 100%; max-width: 560px; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow-lg); overflow: hidden; border: 1px solid var(--border); }
  .palette-input { width: 100%; border: none; border-bottom: 1px solid var(--border); padding: 16px 18px; font-size: 15px; outline: none; background: transparent; color: var(--text); box-sizing: border-box; }
  .palette-list { max-height: 360px; overflow-y: auto; padding: 6px; }
  .palette-group { font-size: 11px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: var(--text-3); padding: 10px 12px 4px; }
  .palette-item { display: flex; align-items: center; gap: 11px; padding: 9px 12px; border-radius: 9px; cursor: pointer; color: var(--text); }
  .palette-item.active { background: color-mix(in srgb, var(--primary) 12%, transparent); }
  .palette-item .pi-ico { width: 26px; height: 26px; border-radius: 7px; background: var(--list-bg); display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
  .palette-item .pi-title { flex: 1; font-size: 14px; }
  .palette-item .pi-hint { font-size: 12px; color: var(--text-3); }
  .palette-empty { padding: 22px; text-align: center; color: var(--text-3); font-size: 13px; }

  /* ---------- 模板选择器 ---------- */
  .tmpl-back { position: fixed; inset: 0; background: rgba(var(--ink), .45); display: flex; align-items: center; justify-content: center; z-index: 65; padding: 16px; }
  body.theme-dark .tmpl-back { background: rgba(0, 0, 0, .55); }
  .tmpl-box { width: 100%; max-width: 660px; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow-lg); overflow: hidden; }
  .tmpl-head { padding: 18px 20px 6px; font-size: 16px; font-weight: 700; }
  .tmpl-sub { padding: 0 20px 14px; font-size: 13px; color: var(--text-3); }
  .tmpl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(172px, 1fr)); gap: 12px; padding: 6px 20px 20px; }
  .tmpl-card { border: 1px solid var(--border); border-radius: 11px; padding: 14px; cursor: pointer; transition: border-color .14s, box-shadow .14s; background: var(--surface); }
  .tmpl-card:hover { border-color: var(--primary); box-shadow: var(--shadow-md); }
  .tmpl-ico { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 19px; color: #fff; margin-bottom: 9px; }
  .tmpl-name { font-weight: 700; font-size: 14px; margin-bottom: 3px; }
  .tmpl-desc { font-size: 12px; color: var(--text-3); line-height: 1.5; }
  /* ---------- 报表仪表盘 ---------- */
  .dash { padding: 18px 22px; display: flex; flex-direction: column; gap: 16px; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
  .kpi .k-label { font-size: 13px; color: var(--text-2); display: flex; align-items: center; gap: 6px; }
  .kpi .k-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .kpi .k-val { font-size: 26px; font-weight: 600; color: var(--text); margin-top: 6px; }
  .kpi.danger .k-val { color: var(--danger); }
  .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; }
  .panel h3 { font-size: 14px; font-weight: 600; margin: 0 0 14px; color: var(--text); }
  .bars { display: flex; height: 156px; position: relative; gap: 10px; }
  .bars::before {
    content: ""; position: absolute; left: 0; right: 0; top: 8px; bottom: 42px;
    background-image: linear-gradient(var(--border) 1px, transparent 1px);
    background-size: 100% 28px; opacity: .45; pointer-events: none;
  }
  .bar-col { flex: 1; position: relative; height: 100%; }
  .bar-track { position: absolute; left: 0; right: 0; top: 8px; bottom: 42px; }
  .bar {
    position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 52px; max-width: 62%; background: var(--primary); border-radius: 6px 6px 0 0;
    min-height: 3px; transition: height .25s ease; box-shadow: inset 0 -12px 10px rgba(255,255,255,.08);
  }
  .bar.zero { height: 3px !important; background: var(--text-3); border-radius: 2px; opacity: .55; }
  .bar-val {
    position: absolute; top: -16px; left: 50%; transform: translateX(-50%);
    font-size: 11px; font-weight: 700; color: var(--text); opacity: 0; transition: opacity .2s;
  }
  .bar-col:hover .bar-val { opacity: 1; }
  .bar-label { position: absolute; bottom: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0 4px; }
  .bl-name { font-size: 12px; color: var(--text-2); line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; position: relative; cursor: default; }
  /* JS 动态创建的真实 DOM 气泡，position:fixed 不受任何祖先 overflow 裁剪 */
  .bar-tip-float {
    position: fixed; z-index: 99999; pointer-events: none;
    background: var(--text); color: var(--surface);
    font-size: 11px; font-weight: 500; padding: 5px 9px;
    border-radius: 7px; white-space: nowrap; max-width: 240px;
    box-shadow: var(--shadow-md);
  }
  .bar-tip-float::after {
    content: ""; position: absolute; bottom: -4px; left: 50%; transform: translateX(-50%);
    border: 5px solid transparent; border-top-color: var(--text);
  }
  .bl-count { flex-shrink: 0; font-size: 11px; font-weight: 700; color: var(--text-3); background: var(--list-bg); border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px; min-width: 20px; text-align: center; }
  .hbar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .hbar-row:last-child { margin-bottom: 0; }
  .hbar-name { width: 48px; font-size: 12px; color: var(--text); flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hbar-track { flex: 1; height: 12px; background: var(--list-bg); border-radius: 6px; overflow: hidden; }
  .hbar-fill { display: block; height: 100%; border-radius: 6px; min-width: 2px; }
  .hbar-val { width: 22px; text-align: right; font-size: 12px; color: var(--text-2); flex-shrink: 0; }
  .ring { display: flex; align-items: center; gap: 18px; }
  .ring-legend { display: flex; flex-direction: column; gap: 10px; }
  .ring-lg { font-size: 13px; color: var(--text-2); display: flex; align-items: center; gap: 8px; }
  .ring-lg b { color: var(--text); font-weight: 600; }
  .ring-lg .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .dash-empty { padding: 60px; text-align: center; color: var(--text-2); }
</style>
</head>
<body>
<div class="app">
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-brand"><span class="dot"></span>Kanboard</div>
      <div class="sidebar-label">项目</div>
      <div class="proj-list" id="projList"></div>
      <div class="sidebar-new"><button id="newProjBtn">＋ 新建项目</button></div>
      <div class="sidebar-footer">
        <select class="theme-select" id="themeSelect" title="切换主题">
          <option value="light">浅色</option>
          <option value="dark">深色</option>
          <option value="warm">暖色</option>
          <option value="forest">森林</option>
        </select>
      </div>
    </aside>
    <div class="main">
      <header class="topbar">
        <div class="board-title" id="boardTitle" title="双击重命名项目">产品迭代看板</div>
        <span class="scope-tag">核心 + 基础 + 增强 Demo</span>
        <div class="view-switch" id="viewSwitch">
          <button data-view="board" class="active">▦ 看板</button>
          <button data-view="table">▤ 表格</button>
          <button data-view="calendar">▦ 日历</button>
          <button data-view="report">▣ 报表</button>
        </div>
        <span class="spacer"></span>
        <span class="hint">⌘K 命令面板 · 点击卡片看详情</span>
      </header>

      <div class="toolbar" id="toolbar">
        <div class="search">
          <span>🔍</span>
          <input id="searchInput" placeholder="搜索卡片标题…" />
        </div>
        <div class="filter-group" id="memberFilter"><span class="lbl">成员</span></div>
        <div class="filter-group" id="labelFilter"><span class="lbl">标签</span></div>
        <select class="due-select" id="dueFilter">
          <option value="">截止日期：全部</option>
          <option value="overdue">已逾期</option>
          <option value="soon">7 天内到期</option>
        </select>
        <button class="clear-filter" id="clearFilter">清除筛选</button>
      </div>

      <main class="board" id="board"></main>
    </div>
  </div>
</div>

<script>
'use strict';
/* ===========================================================
 * Kanboard · 核心 + 基础功能 Demo（单文件，无构建、双击即用）
 * 核心功能：看板 Board / 列 List / 卡片 Card / 拖拽排序
 * 基础功能：创建编辑删除 / 成员分配 / 标签分类 / 截止日期 /
 *          检查清单 / 评论 / 描述 / 附件 / 筛选搜索
 * 增强功能（已加）：视图切换（看板/表格/日历）· 模板库 · @提及 · 命令面板⌘K
 * 仍未实现：自动化规则、通知提醒、泳道/WIP、报表仪表盘、AI、集成插件、实时协作
 * =========================================================== */

var LS_KEY = 'kanban-core-demo.v2';

var state = load();
var filter = { q: '', memberId: null, labelId: null, due: '' };
var currentView = state.view || 'board';
var calYear = new Date().getFullYear();
var calMonth = new Date().getMonth();

/* ---------- 多项目：当前激活项目 ---------- */
function activeProject() { return state.projects.find(function (p) { return p.id === state.activeId; }) || state.projects[0]; }
function P() { return activeProject(); }

/* ---------- 主题 ---------- */
var THEME_KEY = 'kanban-theme';
var VALID_THEMES = ['light', 'dark', 'warm', 'forest'];
function applyTheme(theme) { document.body.classList.remove('theme-light', 'theme-dark', 'theme-warm', 'theme-forest'); if (VALID_THEMES.indexOf(theme) > -1) document.body.classList.add('theme-' + theme); }
function saveTheme(theme) { try { localStorage.setItem(THEME_KEY, theme); } catch (e) {} }
function loadTheme() { try { var t = localStorage.getItem(THEME_KEY); if (VALID_THEMES.indexOf(t) > -1) return t; } catch (e) {} return 'light'; }
var currentTheme = loadTheme(); applyTheme(currentTheme);

/* ---------- 删除二次确认弹窗 ---------- */
function confirmDialog(opts) {
  var back = document.createElement('div'); back.className = 'confirm-back';
  back.innerHTML =
    '<div class="confirm-box">' +
      '<div class="confirm-head">' + esc(opts.title || '确认操作') + '</div>' +
      '<div class="confirm-body">' + esc(opts.message || '') + '</div>' +
      '<div class="confirm-actions">' +
        '<button class="btn-cancel">' + (opts.cancelText || '取消') + '</button>' +
        '<button class="btn-danger">' + (opts.confirmText || '确认') + '</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(back);
  var close = function () { if (back.parentNode) back.parentNode.removeChild(back); };
  back.addEventListener('click', function (e) { if (e.target === back) close(); });
  back.querySelector('.btn-cancel').addEventListener('click', function () { close(); });
  back.querySelector('.btn-danger').addEventListener('click', function () { close(); if (opts.onConfirm) opts.onConfirm(); });
  return close;
}

/* ---------- 工具 ---------- */
function uid(p) { return p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function todayStr() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function daysUntil(dateStr) {
  var a = new Date(todayStr()), b = new Date(dateStr);
  return Math.round((b - a) / 86400000);
}
function fmtSize(n) { if (n < 1024) return n + ' B'; if (n < 1048576) return (n / 1024).toFixed(1) + ' KB'; return (n / 1048576).toFixed(1) + ' MB'; }

/* 仅当列名被截断（出现省略号）时才给该柱子挂 data-tip 气泡；未截断则直接显示全称。
   用 Range API 浮点精确测量文字真实渲染宽度，与元素实际盒宽严格比较（textW > availW）。
   注意：不能用 +1 容差——当文字与可用宽仅差 1px 时浏览器已画省略号，容差会把这种真实截断误判为不截断。 */
function initBarsTooltip() {
  requestAnimationFrame(function () {
  requestAnimationFrame(function () {
  var names = boardEl.querySelectorAll('.bars .bl-name');
  names.forEach(function (el) {
    var label = el.closest('.bar-label');
    if (!label) return;
    // Range 测量文字真实渲染宽度（浮点，不受 overflow/ellipsis 裁剪影响）
    var range = document.createRange();
    range.selectNodeContents(el);
    var textW = range.getBoundingClientRect().width;
    // 可用宽度 = .bl-name 被 flex 压缩后的实际盒宽（浮点）
    var availW = el.getBoundingClientRect().width;
    if (textW > availW) {
      label.setAttribute('data-tip', el.textContent);
    } else {
      label.removeAttribute('data-tip');
    }
  });
  bindBarTips();
  });
  });
}
/* 真实 DOM 气泡：position:fixed 不受祖先 overflow 裁剪，z-index 极高不被遮挡 */
var _barTipEl = null;
function showBarTip(label) {
  hideBarTip();
  var text = label.getAttribute('data-tip');
  if (!text) return;
  _barTipEl = document.createElement('div');
  _barTipEl.className = 'bar-tip-float';
  _barTipEl.textContent = text;
  document.body.appendChild(_barTipEl);
  var r = label.getBoundingClientRect();
  var w = _barTipEl.offsetWidth, h = _barTipEl.offsetHeight;
  var left = Math.max(8, Math.min(window.innerWidth - w - 8, r.left + r.width / 2 - w / 2));
  var top = r.top - h - 8;
  if (top < 8) top = r.bottom + 8; /* 上方放不下就放下方 */
  _barTipEl.style.left = left + 'px';
  _barTipEl.style.top = top + 'px';
}
function hideBarTip() {
  if (_barTipEl) { _barTipEl.remove(); _barTipEl = null; }
}
function bindBarTips() {
  if (boardEl._barTipBound) return;
  boardEl._barTipBound = true;
  boardEl.addEventListener('mouseover', function (e) {
    var label = e.target.closest && e.target.closest('.bars .bar-label[data-tip]');
    if (label) showBarTip(label);
  });
  boardEl.addEventListener('mouseout', function (e) {
    var label = e.target.closest && e.target.closest('.bars .bar-label[data-tip]');
    if (label) hideBarTip();
  });
}

}
/* ---------- 视图：日历 ---------- */
function viewCalendar() {
  var y = calYear, m = calMonth;
  var first = new Date(y, m, 1);
  var startDow = (first.getDay() + 6) % 7; // 周一为一周起始
  var daysInMonth = new Date(y, m + 1, 0).getDate();
  var prevDays = new Date(y, m, 0).getDate();
  var cells = [];
  ['一', '二', '三', '四', '五', '六', '日'].forEach(function (d) { cells.push('<div class="cal-dow">' + d + '</div>'); });
  for (var i = startDow - 1; i >= 0; i--) cells.push('<div class="cal-cell out"><span class="cal-date">' + (prevDays - i) + '</span></div>');
  var today = new Date();
  var cardsByDate = {}, noDue = [];
  P().lists.forEach(function (list) {
    list.cards.forEach(function (card) {
      if (card.due) { if (!cardsByDate[card.due]) cardsByDate[card.due] = []; cardsByDate[card.due].push(card); }
      else noDue.push(card);
    });
  });
  for (var day = 1; day <= daysInMonth; day++) {
    var ds = y + '-' + String(m + 1).padStart(2, '0') + '-' + String(day).padStart(2, '0');
    var isToday = (today.getFullYear() === y && today.getMonth() === m && today.getDate() === day);
    var chips = (cardsByDate[ds] || []).map(function (c) { return '<div class="cal-card" data-card-id="' + c.id + '" title="' + esc(c.title) + '">' + esc(c.title) + '</div>'; }).join('');
    cells.push('<div class="cal-cell' + (isToday ? ' today' : '') + '"><span class="cal-date">' + day + '</span>' + chips + '</div>');
  }
  var needed = Math.ceil((startDow + daysInMonth) / 7) * 7;
  for (var t = 1; t <= needed - (startDow + daysInMonth); t++) cells.push('<div class="cal-cell out"><span class="cal-date">' + t + '</span></div>');
  var html = '<div class="cal-wrap"><div class="cal-head"><button class="cal-nav" data-act="cal-prev">‹</button><h2>' + y + '年 ' + (m + 1) + '月</h2><button class="cal-nav" data-act="cal-next">›</button><button class="cal-nav" data-act="cal-today">今天</button></div><div class="cal-grid">' + cells.join('') + '</div>';
  if (noDue.length) {
    html += '<div class="cal-empty">未设置截止日期（' + noDue.length + ' 张）：' + noDue.map(function (c) { return '<span class="cal-card" data-card-id="' + c.id + '" style="display:inline-block;max-width:220px;margin:0 6px 6px 0;vertical-align:top">' + esc(c.title) + '</span>'; }).join('') + '</div>';
  }
  return html + '</div>';
}
/* ---------- 视图：报表 ---------- */
function viewReport() {
  var p = P();
  var all = [];
  p.lists.forEach(function (l) { l.cards.forEach(function (c) { all.push({ c: c, list: l }); }); });
  var total = all.length;
  if (!total) return '<div class="dash"><div class="dash-empty">这个项目还没有卡片，切换到看板视图添加后，这里会显示统计报表。</div></div>';
  function isDone(x) { return /完成|done|complete/i.test(x.list ? x.list.title : ''); }
  var doneCnt = all.filter(isDone).length;
  var overdue = 0, soon = 0, safe = 0, nodue = 0;
  all.forEach(function (x) {
    if (!x.c.due) { nodue++; return; }
    var d = daysUntil(x.c.due);
    if (d < 0) overdue++; else if (d <= 7) soon++; else safe++;
  });
  var maxList = 1, listBars = p.lists.map(function (l) { maxList = Math.max(maxList, l.cards.length); return { name: l.title, n: l.cards.length }; });
  var maxMem = 1, memBars = p.members.map(function (m) {
    var n = all.filter(function (x) { return (x.c.memberIds || []).indexOf(m.id) > -1; }).length;
    maxMem = Math.max(maxMem, n); return { name: m.name, n: n };
  });
  var maxTag = 1, tagBars = p.labels.map(function (l) {
    var n = all.filter(function (x) { return (x.c.labelIds || []).indexOf(l.id) > -1; }).length;
    maxTag = Math.max(maxTag, n); return { name: l.name, n: n, color: l.color };
  });
  var kpis = '<div class="kpis">' +
    kpi('var(--primary)', '总卡片', total) +
    kpi('var(--success)', '已完成', doneCnt) +
    kpi('var(--warning)', '本周到期', soon) +
    kpi('var(--danger)', '逾期', overdue, true) +
    '</div>';
  var charts = '<div class="charts">' +
    '<div class="panel"><h3>各列卡片分布</h3><div class="bars">' + listBars.map(function (b) {
      var h = maxList ? Math.round(b.n / maxList * 100) : 0;
      var zeroCls = b.n === 0 ? ' zero' : '';
      var tip = '';
      return '<div class="bar-col"><div class="bar-track"><div class="bar' + zeroCls + '" style="height:' + Math.max(3, h) + '%"></div></div><div class="bar-label"' + tip + '><span class="bl-name">' + esc(b.name) + '</span><span class="bl-count">' + b.n + '</span></div></div>';
    }).join('') + '</div></div>' +
    '<div class="panel"><h3>成员负载</h3>' + hbars(memBars, maxMem) + '</div>' +
    '<div class="panel"><h3>标签分布</h3>' + hbars(tagBars, maxTag) + '</div>' +
    '<div class="panel"><h3>截止日期风险</h3>' + donutRing([
      { v: safe, c: 'var(--success)', t: '安全' },
      { v: soon, c: 'var(--warning)', t: '临近(7天内)' },
      { v: overdue, c: 'var(--danger)', t: '逾期' },
      { v: nodue, c: 'var(--text-3)', t: '未排期' }
    ].filter(function (s) { return s.v > 0; }), total) + '</div>' +
    '</div>';
  return '<div class="dash">' + kpis + charts + '</div>';
}
function kpi(color, label, val, danger) {
  return '<div class="kpi' + (danger ? ' danger' : '') + '"><div class="k-label"><span class="k-dot" style="background:' + color + '"></span>' + label + '</div><div class="k-val">' + val + '</div></div>';
}
function hbars(rows, max) {

function donutRing(segs, total) {
  var r = 42, C = 2 * Math.PI * r, acc = 0, circles = '';
  segs.forEach(function (s) {
    var len = C * s.v / total;
    circles += '<circle cx="60" cy="60" r="' + r + '" fill="none" stroke-width="14" style="stroke:' + s.c + '" stroke-dasharray="' + len.toFixed(2) + ' ' + C.toFixed(2) + '" stroke-dashoffset="' + (-acc).toFixed(2) + '" transform="rotate(-90 60 60)"/>';
    acc += len;
  });
  var legend = segs.map(function (s) { return '<div class="ring-lg"><span class="dot" style="background:' + s.c + '"></span>' + s.t + ' <b>' + s.v + '</b></div>'; }).join('');
  return '<div class="ring"><svg viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="截止日期风险分布"><title>截止日期风险</title><circle cx="60" cy="60" r="' + r + '" fill="none" stroke-width="14" style="stroke:var(--list-bg)"/><title>分布</title>' + circles + '<text x="60" y="56" text-anchor="middle" style="fill:var(--text);font-size:20px;font-weight:600">' + total + '</text><text x="60" y="74" text-anchor="middle" style="fill:var(--text-2);font-size:12px">卡片</text></svg><div class="ring-legend">' + legend + '</div></div>';

function getAfter(container, y, selector) {
  var els = Array.prototype.slice.call(container.querySelectorAll(selector));
  var closest = null, offset = -Infinity;
  for (var i = 0; i < els.length; i++) {
    var box = els[i].getBoundingClientRect();
    var d = y - box.top - box.height / 2;
    if (d < 0 && d > offset) { offset = d; closest = els[i]; }
  }
  return closest;
}

    setTimeout(function () { card.classList.add('dragging'); }, 0);

  }
  var handle = e.target.closest('.drag-handle');

    var list = handle.closest('.list'); drag = { type: 'list', id: list.dataset.listId };
    setTimeout(function () { list.classList.add('dragging'); }, 0);

  if (!drag) return; e.preventDefault(); e.dataTransfer.dropEffect = 'move';
  var br = boardEl.getBoundingClientRect();

  if (drag.type === 'card') {
    var listEl = e.target.closest('.list'); if (!listEl) return;
    var cardsEl = listEl.querySelector('.cards');

  } else {
    var afterList = getAfter(boardEl, e.clientX, '.list:not(.dragging)');
    var lph = ensurePlaceholder(boardEl, 'list-placeholder');

  } else { dueMeta = '<span class="meta-empty">未设置</span>'; }

  // 需求描述（富文本）：旧纯文本数据转 <br>；含标签则按 HTML 渲染
  var rawDesc = card.desc || '';
  var descHtml = (rawDesc.indexOf('<') === -1) ? esc(rawDesc).replace(/\n/g, '<br>') : rawDesc;

  var cl = card.checklist || [], clDone = cl.filter(function (x) { return x.done; }).length;
  var clPct = cl.length ? Math.round(clDone / cl.length * 100) : 0;
  var checklistHtml = cl.map(function (i) {
    return '<div class="cl-item ' + (i.done ? 'done' : '') + '" data-kid="' + i.id + '"><input type="checkbox" ' + (i.done ? 'checked' : '') + ' data-act="cl-toggle"><span>' + esc(i.text) + '</span></div>';
  }).join('');
  var commentsHtml = (card.comments && card.comments.length)
    ? card.comments.slice().reverse().map(function (c) {
        return '<div class="cmt"><div class="avatar" style="background:#8a94a6;flex-shrink:0">' + esc((c.who || '?').charAt(0)) + '</div><div class="body"><span class="who">' + esc(c.who || '匿名') + '</span><span class="ts">' + fmtTs(c.ts) + '</span><div class="txt">' + mentionHtml(c.text) + '</div></div></div>';
      }).join('')
    : '<div class="empty-note">暂无评论</div>';
  var attHtml = (card.attachments && card.attachments.length)
    ? card.attachments.map(function (a) {
        var preview = a.dataUrl ? '<img src="' + a.dataUrl + '" alt="">' : '<div class="fico">' + esc((a.name.split('.').pop() || 'F').toUpperCase().slice(0, 4)) + '</div>';
        var dl = a.dataUrl ? '<a class="dl" href="' + a.dataUrl + '" download="' + esc(a.name) + '">下载</a>' : '';
        return '<div class="att" data-aid="' + a.id + '">' + preview + '<div class="meta"><div class="nm">' + esc(a.name) + '</div><div class="sz">' + fmtSize(a.size) + '</div></div>' + dl + '<button class="rm" data-act="att-rm" title="移除">×</button></div>';
      }).join('')
    : '<div class="empty-note">暂无附件</div>';

  back.innerHTML =
    '<div class="modal">' +
      '<div class="modal-head"><div class="modal-title" contenteditable="true" id="mTitle">' + esc(card.title) + '</div><button class="modal-close" id="mClose">×</button></div>' +
      '<div class="modal-body">' +
        // —— 辅助信息（次要层级）：状态 / 负责人 / 时间 ——
        '<div class="meta-bar">' +
          '<span class="meta-item"><span class="lbl">状态</span><span class="meta-status">' + listTitle + '</span></span>' +
          '<span class="meta-item"><span class="lbl">负责人</span>' + assigneeHtml + '</span>' +
          '<span class="meta-item"><span class="lbl">时间</span>' + dueMeta + '</span>' +
        '</div>' +
        // —— 主要展示内容（最高视觉权重，扁平富文本编辑区）：需求描述 ——
        '<div class="desc-block">' +
          '<div class="desc-label">需求描述</div>' +
          '<div class="rt-toolbar" id="rtToolbar">' +
            '<button type="button" data-cmd="bold" title="加粗"><span class="b">B</span></button>' +
            '<button type="button" data-cmd="italic" title="斜体"><span class="i">I</span></button>' +
            '<button type="button" data-cmd="underline" title="下划线"><span class="u">U</span></button>' +
            '<button type="button" data-cmd="strikeThrough" title="删除线"><span class="s">S</span></button>' +
            '<span class="sep"></span>' +
            '<button type="button" data-block="H1" title="大标题">H1</button>' +
            '<button type="button" data-block="H2" title="小标题">H2</button>' +
            '<button type="button" data-block="P" title="正文段落">¶</button>' +
            '<span class="sep"></span>' +
            '<button type="button" data-cmd="insertUnorderedList" title="项目符号列表">•≣</button>' +
            '<button type="button" data-cmd="insertOrderedList" title="编号列表">1.</button>' +
            '<span class="sep"></span>' +
            '<button type="button" data-cmd="formatBlock" data-value="BLOCKQUOTE" title="引用">❝</button>' +
            '<button type="button" data-cmd="foreColor" data-value="#e5484d" title="红色文字"><span class="b" style="color:#e5484d">A</span></button>' +
            '<button type="button" data-cmd="removeFormat" title="清除格式">⌫</button>' +
          '</div>' +
          '<div class="rt-editor" id="mDesc" contenteditable="true" data-placeholder="在此填写需求描述，支持加粗、列表、标题等富文本格式…">' + descHtml + '</div>' +
        '</div>' +
        // —— 次要属性（可编辑）：成员 / 标签 / 截止日期 ——
        '<div class="props">' +
          section('👤', '成员', '<div class="row">' + members + '</div>') +
          section('🏷️', '标签', '<div class="row">' + labels + '</div>') +
          section('📅', '截止日期', '<input type="date" class="due-input" id="mDue" value="' + (card.due || '') + '">') +
        '</div>' +
        // —— 协作信息（次要）：检查清单 / 评论 / 附件 ——
        section('☑️', '检查清单',
          '<div class="cl-progress"><i style="width:' + clPct + '%"></i></div>' +
          '<div id="clList">' + checklistHtml + '</div>' +
          '<div class="cl-add"><input id="clInput" placeholder="添加清单项，回车确认"><button class="btn-primary" data-act="cl-add">添加</button></div>') +
        section('💬', '评论',
          '<div id="cmtList">' + commentsHtml + '</div>' +
          '<div class="cmt-add"><input id="cmtInput" placeholder="写下评论，回车发送"><button class="btn-primary" data-act="cmt-add">发送</button></div>') +
        section('📎', '附件',
          '<div id="attList">' + attHtml + '</div>' +
          '<label class="file-btn">＋ 添加附件<input type="file" id="mFile" hidden></label>') +
      '</div>' +
    '</div>';

  // 绑定
  document.getElementById('mClose').addEventListener('click', closeDetail);
  var mTitle = document.getElementById('mTitle');
  mTitle.addEventListener('blur', function () { var c = findCard(modalCardId); if (c && mTitle.textContent.trim()) { c.title = mTitle.textContent.trim(); save(); render(); } });
  mTitle.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); mTitle.blur(); } });
  document.getElementById('mDue').addEventListener('change', function (e) { var c = findCard(modalCardId); c.due = e.target.value; save(); render(); });
  // 富文本：需求描述
  var rt = document.getElementById('mDesc');
  var rtb = document.getElementById('rtToolbar');
  var saveDesc = function () { var c = findCard(modalCardId); if (c) { c.desc = rt.innerHTML; save(); } };
  var updateToolbarState = function () {
    try {
      rtb.querySelectorAll('button[data-cmd]').forEach(function (b) {
        var st = false; try { st = document.queryCommandState(b.dataset.cmd); } catch (e) {}
        b.classList.toggle('active', !!st);
      });
    } catch (e) {}
  };
  rtb.addEventListener('mousedown', function (e) { if (e.target.closest('button')) e.preventDefault(); });
  rtb.querySelectorAll('button').forEach(function (b) {
    b.addEventListener('click', function () {
      rt.focus();
      if (b.dataset.cmd === 'foreColor') document.execCommand('foreColor', false, b.dataset.value);
      else if (b.dataset.block) document.execCommand('formatBlock', false, '<' + b.dataset.block + '>');
      else if (b.dataset.cmd === 'formatBlock') document.execCommand('formatBlock', false, '<' + b.dataset.value + '>');
      else document.execCommand(b.dataset.cmd, false, null);
      saveDesc(); updateToolbarState();
    });
  });
  rt.addEventListener('input', saveDesc);
  rt.addEventListener('blur', saveDesc);
  rt.addEventListener('keyup', updateToolbarState);
  rt.addEventListener('mouseup', updateToolbarState);
  back.querySelectorAll('[data-act="member"]').forEach(function (b) { b.addEventListener('click', function () { toggle(card.memberIds, b.dataset.id); save(); render(); renderDetail(); }); });
  back.querySelectorAll('[data-act="label"]').forEach(function (b) { b.addEventListener('click', function () { toggle(card.labelIds, b.dataset.id); save(); render(); renderDetail(); }); });
  back.querySelectorAll('[data-act="cl-toggle"]').forEach(function (cb) {
    cb.addEventListener('change', function () { var item = cb.closest('.cl-item'); var c = findCard(modalCardId); var it = c.checklist.find(function (x) { return x.id === item.dataset.kid; }); it.done = cb.checked; save(); render(); renderDetail(); });
  });
  back.querySelector('[data-act="cl-add"]').addEventListener('click', addChecklist);
  document.getElementById('clInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); addChecklist(); } });
  back.querySelector('[data-act="cmt-add"]').addEventListener('click', addComment);
  document.getElementById('cmtInput').addEventListener('keydown', function (e) { if (e.key === 'Enter' && !this._mentionOpen) { e.preventDefault(); addComment(); } });
  bindMentionAutocomplete(document.getElementById('cmtInput'));
  back.querySelectorAll('[data-act="att-rm"]').forEach(function (b) {
    b.addEventListener('click', function () {
      var aid = b.closest('.att').dataset.aid; var c = findCard(modalCardId);
      var att = c.attachments.find(function (x) { return x.id === aid; });
      confirmDialog({ title: '移除附件', message: '确定移除附件「' + (att ? att.name : '') + '」？', confirmText: '移除', onConfirm: function () { c.attachments = c.attachments.filter(function (x) { return x.id !== aid; }); save(); render(); renderDetail(); } });
    });
  });
  document.getElementById('mFile').addEventListener('change', function (e) {
    var f = e.target.files[0]; if (!f) return;
    var c = findCard(modalCardId);
    var handle = function (dataUrl) { c.attachments.push({ id: uid('a'), name: f.name, size: f.size, type: f.type, dataUrl: dataUrl }); save(); render(); renderDetail(); };
    if (f.size <= 2000000 && f.type.indexOf('image/') === 0) {
      var rd = new FileReader(); rd.onload = function () { handle(rd.result); }; rd.readAsDataURL(f);
    } else { handle(null); }
  });
}
function section(ico, title, inner) {
  return '<div class="sec"><div class="sec-ico">' + ico + '</div><div class="sec-main"><div class="sec-title">' + title + '</div>' + inner + '</div></div>';
}
/* 评论 @提及：把 @成员名 高亮 */
function mentionHtml(text) {
  var escText = esc(text);
  var names = P().members.map(function (m) { return m.name; }).filter(Boolean);
  if (!names.length) return escText;
  var pat = names.map(function (n) { return esc(n).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }).join('|');
  return escText.replace(new RegExp('@(' + pat + ')', 'g'), '<span class="mention">@$1</span>');
}
/* 评论输入框：输入 @ 弹出成员自动补全 */
function bindMentionAutocomplete(input) {
  if (!input) return;
  var wrap = input.closest('.cmt-add'); if (!wrap) return;
  var menu = null;
  function closeMenu() { if (menu) { menu.remove(); menu = null; } input._mentionOpen = false; }
  function showMenu(query) {
    closeMenu();
    input._mentionOpen = true;
    var matches = P().members.filter(function (m) { return m.name.toLowerCase().indexOf(query.toLowerCase()) > -1; });
    if (!matches.length) return;
    menu = document.createElement('div'); menu.className = 'mention-menu';
    matches.forEach(function (m) {
      var b = document.createElement('button'); b.type = 'button'; b.dataset.name = m.name;
      b.innerHTML = '<span class="sw" style="background:' + m.color + '"></span>' + esc(m.name);
      menu.appendChild(b);
    });
    wrap.style.position = 'relative'; wrap.appendChild(menu);
    menu.querySelectorAll('button').forEach(function (b) {
      b.addEventListener('mousedown', function (e) { e.preventDefault(); insertMention(b.dataset.name); });
    });
  }
  function insertMention(name) {
    var pos = input.selectionStart != null ? input.selectionStart : input.value.length;
    var before = input.value.slice(0, pos), after = input.value.slice(pos);
    var atIdx = before.lastIndexOf('@');
    if (atIdx === -1) { input.value = before + '@' + name + ' ' + after; }
    else { input.value = before.slice(0, atIdx + 1) + name + ' ' + after; }
    var caret = input.value.length - after.length;
    input.focus(); input.setSelectionRange(caret, caret);
    closeMenu();
  }
  input.addEventListener('input', function () {
    var pos = input.selectionStart; var before = input.value.slice(0, pos);
    var m = before.match(/@([^@\s]*)$/);
    if (m) showMenu(m[1]); else closeMenu();
  });
  // 捕获阶段优先处理，避免与「回车发送」冲突
  input.addEventListener('keydown', function (e) {
    if (!menu) return;
    var items = menu.querySelectorAll('button'), active = menu.querySelector('button.active');
    if (e.key === 'ArrowDown') { e.preventDefault(); e.stopImmediatePropagation(); var i = Array.prototype.indexOf.call(items, active); if (i < items.length - 1) { if (active) active.classList.remove('active'); items[i + 1].classList.add('active'); } }
    else if (e.key === 'ArrowUp') { e.preventDefault(); e.stopImmediatePropagation(); var j = Array.prototype.indexOf.call(items, active); if (j > 0) { if (active) active.classList.remove('active'); items[j - 1].classList.add('active'); } }
    else if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); e.stopImmediatePropagation(); if (active || items.length) insertMention((active || items[0]).dataset.name); }
    else if (e.key === 'Escape') { e.preventDefault(); closeMenu(); }
  }, true);
  input.addEventListener('blur', function () { setTimeout(closeMenu, 150); });
}
function toggle(arr, id) { var i = arr.indexOf(id); if (i > -1) arr.splice(i, 1); else arr.push(id); }
function addChecklist() {
  var inp = document.getElementById('clInput'), v = inp.value.trim(); if (!v) return;
  var c = findCard(modalCardId); c.checklist.push({ id: uid('k'), text: v, done: false });
  save(); render(); renderDetail(); document.getElementById('clInput').focus();
}
function addComment() {
  var inp = document.getElementById('cmtInput'), v = inp.value.trim(); if (!v) return;
  var c = findCard(modalCardId); c.comments.push({ id: uid('m'), who: P().members[0].name, text: v, ts: Date.now() });
  save(); render(); renderDetail(); document.getElementById('cmtInput').focus();
}

/* ---------- 筛选 ---------- */
function renderFilterUI() {
  var mf = document.getElementById('memberFilter');
  mf.querySelectorAll('.fchip').forEach(function (el) { el.remove(); });
  P().members.forEach(function (m) {
    var b = document.createElement('button'); b.className = 'fchip' + (filter.memberId === m.id ? ' active' : '');
    b.style.background = m.color; b.style.color = '#fff'; b.textContent = m.name.charAt(0);
    b.title = '按 ' + m.name + ' 筛选'; b.addEventListener('click', function () { filter.memberId = filter.memberId === m.id ? null : m.id; renderFilterUI(); applyFilter(); });
    mf.appendChild(b);
  });
  var lf = document.getElementById('labelFilter');
  lf.querySelectorAll('.fchip').forEach(function (el) { el.remove(); });
  P().labels.forEach(function (l) {
    var b = document.createElement('button'); b.className = 'fchip dot' + (filter.labelId === l.id ? ' active' : '');
    b.style.background = l.color; b.title = '按 ' + l.name + ' 筛选'; b.addEventListener('click', function () { filter.labelId = filter.labelId === l.id ? null : l.id; renderFilterUI(); applyFilter(); });
    lf.appendChild(b);
  });
}
function applyFilter() {
  var q = filter.q.trim().toLowerCase();
  document.querySelectorAll('[data-card-id]').forEach(function (cardEl) {
    var card = findCard(cardEl.dataset.cardId); if (!card) return;
    var ok = true;
    if (q && card.title.toLowerCase().indexOf(q) === -1) ok = false;
    if (filter.memberId && (card.memberIds || []).indexOf(filter.memberId) === -1) ok = false;
    if (filter.labelId && (card.labelIds || []).indexOf(filter.labelId) === -1) ok = false;
    if (filter.due === 'overdue' && (!card.due || daysUntil(card.due) >= 0)) ok = false;
    if (filter.due === 'soon' && (!card.due || daysUntil(card.due) < 0 || daysUntil(card.due) > 7)) ok = false;
    cardEl.classList.toggle('hidden', !ok);
  });
  // 列表若无可见卡片则隐藏
  document.querySelectorAll('.list').forEach(function (listEl) {
    var any = listEl.querySelectorAll('.card:not(.hidden)').length > 0;
    listEl.classList.toggle('hidden', !any && (q || filter.memberId || filter.labelId || filter.due));
  });
}
document.getElementById('searchInput').addEventListener('input', function (e) { filter.q = e.target.value; applyFilter(); });
document.getElementById('dueFilter').addEventListener('change', function (e) { filter.due = e.target.value; applyFilter(); });
document.getElementById('clearFilter').addEventListener('click', function () {
  filter = { q: '', memberId: null, labelId: null, due: '' };
  document.getElementById('searchInput').value = ''; document.getElementById('dueFilter').value = ''; renderFilterUI(); applyFilter();
});

document.addEventListener('click', function (e) {
  if (!e.target.closest('.list-menu') && !e.target.closest('.list-menu-dropdown') && !e.target.closest('.proj-menu') && !e.target.closest('.proj-menu-dropdown')) { closeMenus(); closeProjMenus(); }
});
document.addEventListener('keydown', function (e) {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette(); return; }
  if (e.key === 'Escape') {
    if (paletteOpen) { closePalette(); return; }
    var tb = document.getElementById('tmplBack'); if (tb) { tb.remove(); return; }
    var cb = document.querySelector('.confirm-back');
    if (cb) { cb.querySelector('.btn-cancel').click(); return; }
    closeMenus();
    if (modalCardId) closeDetail();
  }
});
window.addEventListener('resize', function () { if (currentView === 'report') initBarsTooltip(); });

/* ---------- 命令面板 ⌘K ---------- */
var paletteOpen = false;
function quickAddCard() {
  if (!P().lists.length) return;
  setView('board');
  var lid = P().lists[0].id;
  setTimeout(function () { openComposer(lid); }, 0);
}
function buildCommands() {
  var cmds = [];
  cmds.push({ group: '视图', ico: '▦', title: '看板视图', hint: 'Board', run: function () { setView('board'); } });
  cmds.push({ group: '视图', ico: '▤', title: '表格视图', hint: 'Table', run: function () { setView('table'); } });
  cmds.push({ group: '视图', ico: '▦', title: '日历视图', hint: 'Calendar', run: function () { setView('calendar'); } });
  cmds.push({ group: '视图', ico: '▣', title: '报表视图', hint: 'Report', run: function () { setView('report'); } });
  var themeNames = { light: '浅色', dark: '深色', warm: '暖色', forest: '森林' };
  ['light', 'dark', 'warm', 'forest'].forEach(function (t) {
    cmds.push({ group: '主题', ico: '🎨', title: '主题：' + themeNames[t], hint: 'Theme', run: function () { currentTheme = t; applyTheme(t); saveTheme(t); } });
  });
  state.projects.forEach(function (p) {
    cmds.push({ group: '项目', ico: p.icon, title: '切换到「' + p.name + '」', hint: 'Project', run: function () { switchProject(p.id); } });
  });
  cmds.push({ group: '操作', ico: '＋', title: '新建项目（从模板）', hint: 'New project', run: function () { openTemplatePicker(); } });
  cmds.push({ group: '操作', ico: '＋', title: '在当前项目新建卡片', hint: 'New card', run: function () { quickAddCard(); } });
  cmds.push({ group: '操作', ico: '⌫', title: '清除筛选', hint: 'Clear filter', run: function () { document.getElementById('clearFilter').click(); } });
  return cmds;
}
function openPalette() {
  if (paletteOpen) return; paletteOpen = true;
  var back = document.createElement('div'); back.className = 'palette-back'; back.id = 'paletteBack';
  back.innerHTML = '<div class="palette"><input class="palette-input" id="paletteInput" placeholder="输入命令或搜索…（↑↓ 选择，↵ 执行，Esc 关闭）"><div class="palette-list" id="paletteList"></div></div>';
  document.body.appendChild(back);
  var input = document.getElementById('paletteInput');
  var allCmds = buildCommands(), filtered = allCmds.slice(), activeIdx = 0;
  function renderList() {
    var list = document.getElementById('paletteList');
    if (!filtered.length) { list.innerHTML = '<div class="palette-empty">无匹配命令</div>'; return; }
    var html = '', lastGroup = null;
    filtered.forEach(function (c, i) {
      if (c.group !== lastGroup) { html += '<div class="palette-group">' + c.group + '</div>'; lastGroup = c.group; }
      html += '<div class="palette-item' + (i === activeIdx ? ' active' : '') + '" data-i="' + i + '"><span class="pi-ico">' + c.ico + '</span><span class="pi-title">' + esc(c.title) + '</span><span class="pi-hint">' + esc(c.hint || '') + '</span></div>';
    });
    list.innerHTML = html;
    list.querySelectorAll('.palette-item').forEach(function (it) {
      it.addEventListener('click', function () { runCmd(parseInt(it.dataset.i, 10)); });
      it.addEventListener('mousemove', function () { activeIdx = parseInt(it.dataset.i, 10); });
    });
  }
  function runCmd(i) { var c = filtered[i]; if (!c) return; closePalette(); c.run(); }
  function filter(q) {
    q = q.trim().toLowerCase();
    filtered = q ? allCmds.filter(function (c) { return c.title.toLowerCase().indexOf(q) > -1 || (c.hint || '').toLowerCase().indexOf(q) > -1; }) : allCmds.slice();
    activeIdx = 0; renderList();
  }
  input.addEventListener('input', function () { filter(input.value); });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown') { e.preventDefault(); activeIdx = Math.min(activeIdx + 1, filtered.length - 1); renderList(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); activeIdx = Math.max(activeIdx - 1, 0); renderList(); }
    else if (e.key === 'Enter') { e.preventDefault(); runCmd(activeIdx); }
    else if (e.key === 'Escape') { e.preventDefault(); closePalette(); }
  });
  back.addEventListener('click', function (e) { if (e.target === back) closePalette(); });
  input.focus();
  renderList();
}
function closePalette() { paletteOpen = false; var b = document.getElementById('paletteBack'); if (b) b.remove(); }

/* ---------- 启动 ---------- */
render();

// 新建项目按钮
var newProjBtn = document.getElementById('newProjBtn');
if (newProjBtn) newProjBtn.addEventListener('click', addProject);

// 视图切换按钮
var viewSwitch = document.getElementById('viewSwitch');
if (viewSwitch) viewSwitch.addEventListener('click', function (e) { var b = e.target.closest('button[data-view]'); if (b) setView(b.dataset.view); });

// 绑定主题选择器（脚本在 </body> 前，DOM 已可用）
var themeSelect = document.getElementById('themeSelect');
if (themeSelect) {
  themeSelect.value = currentTheme;
  themeSelect.addEventListener('change', function () {
    currentTheme = this.value;
    applyTheme(currentTheme);
    saveTheme(currentTheme);
  });
}
